<!DOCTYPE html>
<html lang="kk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Бір айнымалысы бар сызықтық теңсіздіктер</title>
<link href="https://fonts.googleapis.com/css2?family=Didact+Gothic&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:'Century Gothic','Didact Gothic',CenturyGothic,AppleGothic,sans-serif;overflow:hidden;
background:linear-gradient(135deg,#F5EDE4,#E8DDD3,#D4E0D8,#E8DDD3,#F5EDE4);background-size:300% 300%;
animation:bgflow 12s ease infinite;display:flex;align-items:center;justify-content:center;color:#3d4a43}
@keyframes bgflow{0%,100%{background-position:0% 50%}50%{background-position:100% 50%}}
.glow{position:fixed;border-radius:50%;filter:blur(70px);opacity:.35;animation:pulse 6s ease-in-out infinite;pointer-events:none}
.g1{width:340px;height:340px;background:#E8634A;top:-80px;left:-60px}
.g2{width:300px;height:300px;background:#8FA89E;bottom:-60px;right:-40px;animation-delay:1.5s}
.g3{width:260px;height:260px;background:#F0C8A0;top:40%;left:55%;animation-delay:3s}
.g4{width:280px;height:280px;background:#A3B5AD;bottom:10%;left:8%;animation-delay:4.5s}
@keyframes pulse{0%,100%{transform:scale(1);opacity:.25}50%{transform:scale(1.25);opacity:.45}}
.particle{position:fixed;width:5px;height:5px;border-radius:50%;pointer-events:none;animation:twinkle 3s ease-in-out infinite}
@keyframes twinkle{0%,100%{opacity:.1;transform:scale(.6)}50%{opacity:.9;transform:scale(1.3)}}
.snow{position:fixed;top:-20px;color:#fff;pointer-events:none;animation:fall linear infinite;text-shadow:0 0 4px rgba(143,168,158,.6)}
@keyframes fall{to{transform:translateY(110vh) rotate(360deg)}}
#progress{position:fixed;top:20px;left:50%;transform:translateX(-50%);width:260px;height:8px;background:rgba(255,255,255,.6);border-radius:8px;overflow:hidden;z-index:20}
#progressFill{height:100%;width:0;background:linear-gradient(90deg,#E8634A,#F07050);border-radius:8px;transition:width .6s cubic-bezier(.34,1.56,.64,1)}
#fsBtn{position:fixed;top:20px;right:24px;width:44px;height:44px;border-radius:12px;border:none;background:rgba(255,255,255,.8);cursor:pointer;display:flex;align-items:center;justify-content:center;z-index:30;backdrop-filter:blur(8px);transition:transform .2s}
#fsBtn:hover{transform:scale(1.08)}
#subject{position:fixed;top:20px;left:24px;font-size:12px;color:#8FA89E;z-index:20}
#scene{position:relative;width:92%;max-width:1200px;height:560px;z-index:5}
#panel{position:absolute;top:10px;left:50%;transform:translateX(-50%);width:calc(100% - 20px);max-width:440px;padding:24px 28px;background:rgba(255,255,255,.92);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-radius:24px;box-shadow:0 10px 40px rgba(0,0,0,.08);z-index:10}
#topic{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:#8FA89E;margin-bottom:8px}
#question{font-size:18px;font-weight:700;margin-bottom:16px;line-height:1.35}
.ans{display:block;width:100%;text-align:left;padding:12px 16px;margin-bottom:10px;background:#fff;border:2px solid #D4E0D8;border-radius:14px;font:inherit;font-size:15px;color:#3d4a43;cursor:pointer;transition:transform .25s,border-color .25s,background .25s,color .25s}
.ans:last-child{margin-bottom:0}
.ans:hover:not(:disabled){transform:translateX(6px);border-color:#6B8F7B}
.ans:disabled{cursor:default}
.ans.correct{background:#6B8F7B;border-color:#6B8F7B;color:#fff}
.ans.wrong{background:#E8634A;border-color:#E8634A;color:#fff}
.ans .n{opacity:.55;font-size:11px;margin-right:10px}
#road{position:absolute;left:0;right:0;bottom:10px;width:100%;height:160px}
.marker{position:absolute;width:12px;height:12px;border-radius:50%;background:#fff;border:2px solid #A3B5AD;transform:translate(-50%,50%);z-index:3;transition:background .4s}
.marker.done{background:#6B8F7B;border-color:#6B8F7B}
.marker.current{background:#8FA89E;border-color:#8FA89E;animation:mpulse 1.2s ease-in-out infinite}
@keyframes mpulse{0%,100%{box-shadow:0 0 0 0 rgba(143,168,158,.7)}50%{box-shadow:0 0 0 10px rgba(143,168,158,0)}}
#hero{position:absolute;width:160px;height:290px;bottom:20px;left:5%;z-index:6;transition:left .9s cubic-bezier(.34,1.56,.64,1),bottom .9s cubic-bezier(.34,1.56,.64,1);display:flex;align-items:flex-end;justify-content:center;pointer-events:none}
#heroInner{width:100%;height:100%;display:flex;align-items:flex-end;justify-content:center;animation:bob 2.5s ease-in-out infinite}
#hero.walking #heroInner{animation:walk .45s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
@keyframes walk{0%,100%{transform:translateY(0) rotate(-3deg)}50%{transform:translateY(-16px) rotate(3deg)}}
#goal{position:absolute;width:320px;height:230px;bottom:0;right:5%;z-index:4;display:flex;align-items:flex-end;justify-content:center;animation:goalbob 3s ease-in-out infinite;pointer-events:none}
@keyframes goalbob{0%,100%{transform:translateY(0) scale(1)}50%{transform:translateY(-8px) scale(1.02)}}
.pic{max-width:100%;max-height:100%;object-fit:contain}
.emoji{font-size:150px;line-height:1}
#heroInner .pic{height:100%;width:auto;filter:drop-shadow(0 8px 10px rgba(0,0,0,.18))}
#goal .pic{width:100%;height:100%;object-fit:contain;filter:drop-shadow(0 10px 14px rgba(60,50,40,.25))}
#counter{position:fixed;bottom:12px;left:50%;transform:translateX(-50%);background:rgba(255,255,255,.7);padding:6px 20px;border-radius:20px;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);color:#8FA89E;font-size:13px;z-index:20}
#final{position:fixed;inset:0;background:rgba(245,237,228,.95);display:none;flex-direction:column;align-items:center;justify-content:center;text-align:center;z-index:50;padding:24px}
#final.show{display:flex}
#final h1{font-size:42px;color:#E8634A;margin-bottom:16px}
#final p{font-size:20px;margin-bottom:28px;max-width:520px;line-height:1.4}
#again{font:inherit;font-size:18px;padding:14px 36px;background:transparent;border:2px solid #E8634A;color:#E8634A;border-radius:14px;cursor:pointer;transition:background .25s,color .25s}
#again:hover{background:#E8634A;color:#fff}
@media(max-width:760px){#scene{height:600px}#hero{width:100px;height:180px}#goal{width:200px;height:140px}.emoji{font-size:90px}#question{font-size:16px}#panel{padding:18px 20px}}
</style>
</head>
<body>
<div class="glow g1"></div><div class="glow g2"></div><div class="glow g3"></div><div class="glow g4"></div>
<div id="subject">Математика · 6 сынып</div>
<div id="progress"><div id="progressFill"></div></div>
<button id="fsBtn" aria-label="Толық экран"></button>

<div id="scene">
  <div id="panel">
    <div id="topic">Бір айнымалысы бар сызықтық теңсіздіктер</div>
    <div id="question"></div>
    <div id="answers"></div>
  </div>
  <svg id="road" viewBox="0 0 1000 160" preserveAspectRatio="none">
    <defs><linearGradient id="rg" x1="0" x2="1"><stop offset="0" stop-color="#D4E0D8"/><stop offset="1" stop-color="#8FA89E"/></linearGradient></defs>
    <path id="roadPath" d="M60 110 C 240 20, 380 150, 520 85 S 690 45, 790 100" fill="none" stroke="url(#rg)" stroke-width="46" stroke-linecap="round" opacity=".85"/>
    <path d="M60 110 C 240 20, 380 150, 520 85 S 690 45, 790 100" fill="none" stroke="#fff" stroke-width="3" stroke-dasharray="3 12" stroke-linecap="round"/>
  </svg>
  <div id="markers"></div>
  <div id="hero"><div id="heroInner"></div></div>
  <div id="goal"></div>
</div>
<div id="counter">Сұрақ 1 / 10</div>

<div id="final">
  <h1 id="fTitle"></h1>
  <p id="fText"></p>
  <button id="again">Қайта ойнау</button>
</div>

<script>
const POOL=[
{q:"Бір айнымалысы бар сызықтық теңсіздік деп қандай теңсіздікті айтады?",a:["ax > b немесе ax < b түріндегі теңсіздік (a, b — сандар, x — айнымалы)","ax + b = 0 түріндегі теңдеуді","x² > b түріндегі теңсіздікті"],c:0},
{q:"Төмендегілердің қайсысы бір айнымалысы бар сызықтық теңсіздік?",a:["x² − 5 > 0","3x + 5 > 21 − x","3 / x < 2"],c:1},
{q:"Бір айнымалысы бар теңсіздіктің шешімі деп нені айтады?",a:["Теңсіздіктің сол жағындағы өрнекті","Теңсіздік белгісін","Айнымалының теңсіздікті тура сандық теңсіздікке айналдыратын мәнін"],c:2},
{q:"Теңсіздікті шешу дегеніміз не?",a:["Оның барлық шешімдер жиынын табу немесе шешімі жоқ екенін дәлелдеу","Оның бір ғана шешімін табу","Айнымалыны нөлге теңестіру"],c:0},
{q:"Қандай теңсіздіктер мәндес теңсіздіктер деп аталады?",a:["Сол жақтары бірдей теңсіздіктер","Шешімдері бірдей теңсіздіктер","Таңбалары бірдей теңсіздіктер"],c:1},
{q:"Теңсіздіктің мүшесін бір бөлігінен екінші бөлігіне қарама-қарсы таңбамен көшірсек, не болады?",a:["Теңсіздік белгісі өзгереді","Теңсіздіктің шешімі жоғалады","Берілген теңсіздік мәндес теңсіздікке түрленеді"],c:2},
{q:"Теңсіздіктің екі бөлігін де бірдей теріс санға көбейткенде немесе бөлгенде теңсіздік белгісі қалай өзгереді?",a:["Қарама-қарсы белгіге өзгереді","Өзгермейді","Теңдік белгісіне ауысады"],c:0},
{q:"ax > b теңсіздігінде a > 0 болса, шешімі қандай болады?",a:["x < b/a","x > b/a","x > −b/a"],c:1},
{q:"ax > b теңсіздігінде a < 0 болса, шешімі қандай болады?",a:["x > b/a","x = b/a","x < b/a"],c:2},
{q:"a = 0 және b > 0 болғанда 0·x > b теңсіздігінің шешімі қандай?",a:["Кез келген сан","Шешімі жоқ (∅)","x = b"],c:1},
{q:"ax ≥ b теңсіздігінде a > 0 болса, шешімі қандай болады?",a:["x ≥ b/a","x ≤ b/a","x ≥ −b/a"],c:0},
{q:"ax ≥ b теңсіздігінде a < 0 болса, шешімі қандай болады?",a:["x ≥ b/a","x ≤ −b/a","x ≤ b/a"],c:2},
{q:"2x ≥ 8 теңсіздігінің шешімі қайсы?",a:["x ≤ 4","x ≥ 4","x ≥ 16"],c:1},
{q:"x ≥ 4 теңсіздігінің шешімдер жиыны сан аралығы түрінде қалай жазылады?",a:["(4; +∞)","(−∞; 4]","[4; +∞)"],c:2},
{q:"x < −6 теңсіздігінің шешімдер жиыны сан аралығы түрінде қалай жазылады?",a:["(−∞; −6)","(−6; +∞)","(−∞; −6]"],c:0},
{q:"Қатаң емес теңсіздікте (≥ немесе ≤) аралықтың шеткі нүктесі шешімге кіре ме?",a:["Жоқ, кірмейді, дөңгелек жақшамен жазылады","Иә, кіреді, квадрат жақшамен жазылады","Кейде ғана кіреді"],c:1},
{q:"Қатаң теңсіздікте (> немесе <) аралықтың шеткі нүктесі қалай жазылады?",a:["Квадрат жақшамен, нүкте шешімге кіреді","Жақшасыз","Дөңгелек жақшамен, нүкте шешімге кірмейді"],c:2},
{q:"−4x < 12 теңсіздігінің екі жағын −4-ке бөлгенде қандай теңсіздік шығады?",a:["x > −3","x < −3","x > 3"],c:0},
{q:"3x − 7 < x + 3 теңсіздігінде мүшелерді көшіргенде қандай мәндес теңсіздік шығады?",a:["3x + x < 3 + 7","3x − x < 3 + 7","3x − x < 3 − 7"],c:1},
{q:"a = 0 және b < 0 болғанда 0·x > b теңсіздігінің шешімі қандай?",a:["Шешімі жоқ","x = b","Кез келген сан, яғни (−∞; +∞)"],c:2},
{q:"Шешімі жоқ теңсіздіктің шешімдер жиыны қалай белгіленеді?",a:["∅ (бос жиын)","(−∞; +∞)","{0}"],c:0},
{q:"Теңсіздіктің екі жағын бірдей оң санға көбейткенде теңсіздік белгісі қалай өзгереді?",a:["Қарама-қарсы белгіге өзгереді","Өзгермейді","Теңдік белгісіне ауысады"],c:1},
{q:"x/2 − 5x/3 > 7 теңсіздігіндегі бөлшектерден құтылу үшін екі жағын қай санға көбейту ыңғайлы (ЕКОЕ)?",a:["3","5","6"],c:2},
{q:"(−∞; +∞) аралығы нені білдіреді?",a:["Айнымалының кез келген мәнін","Тек оң сандарды","Шешімнің жоқтығын"],c:0},
{q:"Қайсысы мәндес теңсіздіктер жұбы?",a:["x > 3 және x < 3","−4x < 12 және x > −3","2x > 4 және x > 4"],c:1},
{q:"Сызықтық теңсіздікті шешу нұсқауы бойынша айнымалысы бар мүшелерді қай жаққа жинақтайды?",a:["Оң жағына","Қай жағына болса да бәрібір","Сол жағына, ал бос мүшелерді оң жағына"],c:2},
{q:"5x − 1 ≥ 3x + 7 теңсіздігінің шешімі қайсы?",a:["x ≥ 4","x ≤ 4","x ≥ 3"],c:0},
{q:"4x − 5 < 3x + 1 теңсіздігінің шешімі қайсы?",a:["x > 6","x < 6","x < −4"],c:1},
{q:"3x + 7 > x + 15 теңсіздігінің шешімі қайсы?",a:["x < 4","x > 11","x > 4"],c:2},
{q:"Теңсіздікті мәндес теңсіздікке түрлендірудің оқулықтағы ережесі нешеу?",a:["3","2","4"],c:0}
];
const TOTAL=10;
let QUESTIONS=[],usedIdx=new Set();
function shuf(arr){for(let i=arr.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[arr[i],arr[j]]=[arr[j],arr[i]]}return arr}
function pickQuestions(){
  let fresh=POOL.map((_,i)=>i).filter(i=>!usedIdx.has(i));
  if(fresh.length<TOTAL){usedIdx.clear();fresh=POOL.map((_,i)=>i)}
  const chosen=shuf(fresh).slice(0,TOTAL);
  chosen.forEach(i=>usedIdx.add(i));
  QUESTIONS=chosen.map(i=>{const p=POOL[i];const order=shuf([0,1,2]);return{q:p.q,a:order.map(k=>p.a[k]),c:order.indexOf(p.c)}});

let cur=0,step=0,score=0,isAnimating=false,actx=null;
const $=id=>document.getElementById(id);
const scene=$('scene'),road=$('road'),path=$('roadPath'),hero=$('hero'),goal=$('goal'),markersEl=$('markers');

function setPic(el,src,emoji){
  el.innerHTML='';
  const img=new Image();img.className='pic';img.alt='';
  img.onerror=()=>{el.innerHTML='<span class="emoji">'+emoji+'</span>'};
  img.src=src;el.appendChild(img);
}
setPic($('heroInner'),IMG_HERO,'👧');
setPic(goal,IMG_GOAL,'🏠');

/* decor */
const pal=['#E8634A','#8FA89E','#F0C8A0','#A3B5AD'];
for(let i=0;i<20;i++){const p=document.createElement('div');p.className='particle';p.style.cssText=`left:${Math.random()*100}%;top:${Math.random()*100}%;background:${pal[i%4]};animation-delay:${Math.random()*3}s;animation-duration:${2+Math.random()*3}s`;document.body.appendChild(p)}
for(let i=0;i<12;i++){const s=document.createElement('div');s.className='snow';s.textContent=i%2?'❄':'✦';s.style.cssText=`left:${Math.random()*100}%;font-size:${10+Math.random()*12}px;animation-duration:${9+Math.random()*9}s;animation-delay:${-Math.random()*15}s;opacity:.8`;document.body.appendChild(s)}

/* audio */
function ctx(){if(!actx){actx=new (window.AudioContext||window.webkitAudioContext)()}if(actx.state==='suspended')actx.resume();return actx}
function tone(f,t0,dur,type,vol){const a=ctx(),o=a.createOscillator(),g=a.createGain();o.type=type;o.frequency.setValueAtTime(f,a.currentTime+t0);g.gain.setValueAtTime(0,a.currentTime+t0);g.gain.linearRampToValueAtTime(vol,a.currentTime+t0+.03);g.gain.exponentialRampToValueAtTime(.001,a.currentTime+t0+dur);o.connect(g);g.connect(a.destination);o.start(a.currentTime+t0);o.stop(a.currentTime+t0+dur+.05)}
function sndOk(){[523.25,659.25,783.99].forEach((f,i)=>tone(f,i*.1,.6,'sine',.25))}
function sndBad(){const a=ctx(),t=a.currentTime;const o=a.createOscillator(),g=a.createGain();o.type='triangle';o.frequency.setValueAtTime(330,t);o.frequency.exponentialRampToValueAtTime(220,t+.4);g.gain.setValueAtTime(.2,t);g.gain.exponentialRampToValueAtTime(.001,t+.45);o.connect(g);g.connect(a.destination);o.start(t);o.stop(t+.5);tone(180,0,.4,'sawtooth',.08)}
function sndWin(){[523.25,587.33,659.25,783.99,1046.5].forEach((f,i)=>tone(f,i*.15,.5,'sine',.25))}

/* geometry */
function pointAt(s){const L=path.getTotalLength();const p=path.getPointAtLength(L*s/TOTAL);const r=road.getBoundingClientRect(),sr=scene.getBoundingClientRect();
  return{x:(r.left-sr.left)+p.x*r.width/1000, yb:(sr.bottom-r.bottom)+(160-p.y)*r.height/160}}
function buildMarkers(){markersEl.innerHTML='';for(let i=0;i<=TOTAL;i++){const m=document.createElement('div');m.className='marker';m.dataset.i=i;const p=pointAt(i);m.style.left=p.x+'px';m.style.bottom=p.yb+'px';markersEl.appendChild(m)}updateMarkers()}
function updateMarkers(){markersEl.querySelectorAll('.marker').forEach(m=>{const i=+m.dataset.i;m.classList.toggle('done',i<step);m.classList.toggle('current',i===step)})}
function placeHero(){const p=pointAt(step);hero.style.left=(p.x-hero.offsetWidth/2)+'px';hero.style.bottom=(p.yb-6)+'px'}
function layout(){buildMarkers();placeHero()}
window.addEventListener('resize',layout);

/* game */
function render(){
  const d=QUESTIONS[cur];
  $('question').textContent=d.q;
  const box=$('answers');box.innerHTML='';
  d.a.forEach((t,i)=>{const b=document.createElement('button');b.className='ans';b.innerHTML='<span class="n">'+(i+1)+'</span>';b.appendChild(document.createTextNode(t));b.onclick=()=>answer(i,b);box.appendChild(b)});
  $('counter').textContent=`Сұрақ ${cur+1} / ${TOTAL}`;
  $('progressFill').style.width=(cur/TOTAL*100)+'%';
}
function answer(i,btn){
  if(isAnimating)return;isAnimating=true;
  const d=QUESTIONS[cur],btns=[...document.querySelectorAll('.ans')];
  btns.forEach(b=>b.disabled=true);
  if(i===d.c){btn.classList.add('correct');sndOk();step=Math.min(TOTAL,step+1);score++}
  else{btn.classList.add('wrong');btns[d.c].classList.add('correct');sndBad();step=Math.max(0,step-1)}
  hero.classList.add('walking');updateMarkers();placeHero();
  setTimeout(()=>hero.classList.remove('walking'),950);
  setTimeout(()=>{
    cur++;$('progressFill').style.width=(cur/TOTAL*100)+'%';
    if(cur>=TOTAL){finish()}else{render();isAnimating=false}
  },1700);
}
function finish(){
  const win=step>=TOTAL;
  $('fTitle').textContent=win?'Жарайсың! 🎉':'Ойын аяқталды';
  $('fText').textContent=`Дұрыс жауап: ${score} / ${TOTAL}. `+(win?'Кейіпкер үйшікке жетті!':`Кейіпкер үйшікке дейін жете алмады (${step} / ${TOTAL} қадам). Тағы бір рет байқап көр, жаңа сұрақтар түседі!`);
  if(win)sndWin();
  $('final').classList.add('show');isAnimating=false;
}
$('again').onclick=()=>{cur=0;step=0;score=0;$('final').classList.remove('show');pickQuestions();updateMarkers();placeHero();render()};

/* fullscreen */
const ICON_IN='<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#6B8F7B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>';
const ICON_OUT='<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#6B8F7B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 4v5H4M15 4v5h5M9 20v-5H4M15 20v-5h5"/></svg>';
const fsEl=()=>document.fullscreenElement||document.webkitFullscreenElement;
function updFs(){$('fsBtn').innerHTML=fsEl()?ICON_OUT:ICON_IN;setTimeout(layout,150)}
$('fsBtn').onclick=()=>{const e=document.documentElement;
  if(!fsEl()){(e.requestFullscreen||e.webkitRequestFullscreen).call(e)}
  else{(document.exitFullscreen||document.webkitExitFullscreen).call(document)}};
document.addEventListener('fullscreenchange',updFs);
document.addEventListener('webkitfullscreenchange',updFs);

pickQuestions();updFs();render();layout();
window.addEventListener('load',layout);
</script>
